<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致 我的朋友傑恩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 晚霞海風動態背景 */
            background: linear-gradient(-45deg, #ff7e5f, #feb47b, #ff758c, #ff7eb3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3D 舞台 */
        .stage {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
        }

        /* 純白立體信封 */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            transition: transform 0.6s ease;
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 8px;
        }

        /* 信紙（初始藏在信封內） */
        .letter {
            position: absolute;
            top: 10px;
            left: 5%;
            width: 90%;
            height: 90%;
            background: #ffffff;
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            opacity: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 純白信封正面口袋 */
        .envelope-front {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-front::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            border-left: 160px solid #ffffff;
            border-top: 110px solid transparent;
            border-bottom: 110px solid #ffffff;
            border-radius: 0 0 0 8px;
        }

        .envelope-front::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            border-right: 160px solid #fafafa;
            border-top: 110px solid transparent;
            border-bottom: 110px solid #fafafa;
            border-radius: 0 0 8px 0;
        }

        /* 3D 純白頂蓋 */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #ffffff;
            transform-origin: top;
            transition: transform 0.6s ease, z-index 0.2s 0.3s;
            z-index: 4;
        }

        /* 笑臉標誌 */
        .smile-seal {
            position: absolute;
            top: -110px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        .tip-text {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            transition: opacity 0.4s ease;
        }

        /* 點擊展開後的動畫 */
        .stage.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .stage.open .letter {
            opacity: 1;
            animation: extractAndExpand 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.5s;
            z-index: 10;
        }

        .stage.open .tip-text {
            opacity: 0;
        }

        @keyframes extractAndExpand {
            0% {
                transform: translateY(0) scale(1);
            }
            40% {
                transform: translateY(-220px) scale(1);
            }
            100% {
                transform: translateY(-50px) scale(1.25);
                box-shadow: 0 25px 50px rgba(0,0,0,0.35);
            }
        }

        /* 信件內容樣式 */
        .letter-header {
            font-size: 0.9rem;
            color: #e84118;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .letter-content {
            font-size: 0.75rem;
            color: #2f3640;
            line-height: 1.8;
            text-align: justify;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 130px;
            padding-right: 4px;
        }

        .letter-footer {
            text-align: right;
            font-size: 0.7rem;
            color: #718093;
            font-weight: bold;
            border-top: 1px solid #eee;
            padding-top: 6px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="stage" id="stage" onclick="openLetter()">
        <div class="envelope">
            <div class="envelope-back"></div>
            
            <!-- 信紙 -->
            <div class="letter">
                <div class="letter-header">✨ 致 我的朋友傑恩</div>
                <div class="letter-content">每次想到我们几个吹着海风，傍着晚霞，开着玩笑骑车的时光，就不自觉微笑，眼眶也湿润了， 那些日子是多么自在潇洒，真的很幸运我的青春中有你， 又想到我们互相倾诉的那想法和感情，现在看来真是愚蠢而天真，我们的友情淡如水，但这涓涓细流深刻而永恒，那最疯狂的笑声里藏着最真诚的友谊，笑死我了，总之，不管之后面对什么困难，一想到有这样一份可靠的友谊就倍感安慰，放假回去一定再出来爽玩</div>
                <div class="letter-footer">
                    期待放假見面 🚲🌅
                </div>
            </div>

            <div class="envelope-front"></div>
            
            <!-- 純白信封蓋子 + 笑臉 -->
            <div class="flap">
                <div class="smile-seal">😊</div>
            </div>
        </div>

        <div class="tip-text">點擊拆開信封 🌅</div>
    </div>

    <script>
        function openLetter() {
            const stage = document.getElementById('stage');
            if (!stage.classList.contains('open')) {
                stage.classList.add('open');
            }
        }
    </script>

</body>
</html>
